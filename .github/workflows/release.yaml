name: Release

# Tagging and publishing MUST live in one workflow.
# GitHub does not start a workflow run for events created with the default
# GITHUB_TOKEN, so a tag pushed by a job here can never trigger a separate
# tag-triggered publish workflow.

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and create tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "tag ${tag} already exists; nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to PyPI
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/neuromorphopy/${{ needs.tag.outputs.version }}
    permissions:
      # required for PyPI Trusted Publishing (OIDC)
      id-token: write
      # required to create the GitHub release
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.tag.outputs.version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        # uv detects the OIDC environment and authenticates without a token
        run: uv publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            dist/*
