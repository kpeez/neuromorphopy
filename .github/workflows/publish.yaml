name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # IMPORTANT: This permission is required for Trusted Publishing (OIDC)
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Detect version change
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib

          def read_version(ref: str) -> str:
            data = subprocess.check_output(["git", "show", f"{ref}:pyproject.toml"])
            return tomllib.loads(data.decode())["project"]["version"]

          before = os.environ.get("BEFORE_SHA")
          current = read_version("HEAD")
          previous = None
          if before and before != "0000000000000000000000000000000000000000":
            previous = read_version(before)

          changed = previous != current
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"version={current}\n")
            f.write(f"changed={'true' if changed else 'false'}\n")

          print(f"previous={previous} current={current} changed={changed}")
          PY

      - name: Build package
        if: steps.version.outputs.changed == 'true'
        run: uv build

      - name: Publish to PyPI
        # uv automatically detects the OIDC environment and authenticates without a token
        if: steps.version.outputs.changed == 'true'
        run: uv publish
