name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # IMPORTANT: This permission is required for Trusted Publishing (OIDC)
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Validate tag matches version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
            raise SystemExit(f"unexpected tag: {tag}")

          with open("pyproject.toml", "rb") as handle:
            version = tomllib.load(handle)["project"]["version"]

          expected = f"v{version}"
          if tag != expected:
            raise SystemExit(f"tag {tag} does not match pyproject version {version}")

          print(f"tag {tag} matches version {version}")
          PY

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        # uv automatically detects the OIDC environment and authenticates without a token
        run: uv publish
