name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # never cancel a run on main; only supersede in-flight PR pushes
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Cache prek
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Setup Python/uv + deps
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"
          install-args: "--frozen"

      - name: Run checks
        run: uv run prek run --all-files --show-diff-on-failure
      - name: Run type check
        run: uv run ty check

  test:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - name: Setup Python/uv + deps
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          install-args: "--frozen"

      - name: Run tests
        run: uv run pytest -q

  docs:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python/uv + deps
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"
          install-args: "--frozen"

      - name: Build docs
        run: uv run mkdocs build --strict
