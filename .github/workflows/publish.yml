name: Publish to PyPI

on:
  push:
    tags:
      - "v*"  # Triggers on tags like v0.3.3, v1.0.0

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: This permission is required for Trusted Publishing (OIDC)
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        # uv automatically detects the OIDC environment and authenticates without a token
        run: uv publish
